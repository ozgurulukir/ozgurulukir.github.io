<!DOCTYPE html>
<html lang="{% if lang %}{{ lang }}{% else %}en{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} — Ozgur Ulukir{% else %}Ozgur Ulukir — Developer{% endif %}</title>
  {% if description %}<meta name="description" content="{{ description }}">{% else %}<meta name="description" content="Ozgur Ulukir — developer building developer tools, CLI utilities, and AI agent workflows. Featured projects, skills, and contact.">{% endif %}
  <link rel="canonical" href="https://ozgurulukir.github.io{{ page.url }}">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2ead8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17130e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position: absolute;" aria-hidden="true">
    <symbol id="external-icon" viewBox="0 0 16 16">
      <path fill="currentColor" d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h3.646a.75.75 0 0 1 .75.75v3.646a.75.75 0 0 1-1.28.53L12.53 4.78l-4.75 4.75a.75.75 0 0 1-1.06-1.06l4.75-4.75-1.14-1.14a.75.75 0 0 1 .53-1.28Z"/>
    </symbol>
  </svg>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav aria-label="Primary">
      <a class="brand" href="/"><svg class="star" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0l1.9 5.1 5.4.3-4.2 3.5 1.4 5.3L8 11.3l-4.5 2.9 1.4-5.3L.7 5.4l5.4-.3L8 0z"/></svg>ozgurulukir</a>
      <ul class="nav-list">
        <li><a href="/#about">About</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/blog/"{% if page.url and page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© 2026 Ozgur Ulukir · Built with plain HTML &amp; CSS, blog by <a href="https://www.11ty.dev/" target="_blank" rel="noopener noreferrer">Eleventy <svg class="external-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><use href="#external-icon"></use></svg><span class="sr-only">(opens in new tab)</span></a></p>
  </footer>
</body>
</html>
