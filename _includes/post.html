---
layout: base.html
---
  <article class="post">
    <header class="post-header">
      <h1>{{ title }}</h1>
      <time datetime="{{ page.date | isoDate }}">{{ page.date | postDate }}</time>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <p class="post-back"><a href="/blog/">← All posts</a></p>
  </article>
