---
layout: base.html
---
  <article class="post">
    <header class="post-header">
      <h1>{{ title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | isoDate }}">{{ page.date | postDate }}</time>
        <span class="read-time">{{ content | readingTime: lang }}</span>
      </div>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <p class="post-back"><a href="/blog/"><span aria-hidden="true">←</span> All posts</a></p>
  </article>
