---
layout: base.html
---
  <article class="post">
    <nav aria-label="Breadcrumb" class="breadcrumb-nav">
      <ol class="breadcrumb-list">
        <li><a href="/">Home</a></li>
        <li><a href="/blog/">Blog</a></li>
        <li aria-current="page" title="{{ title }}"><span class="sr-only">Current article: </span>{{ title }}</li>
      </ol>
    </nav>
    <header class="post-header">
      <h1>{{ title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | isoDate }}">{{ page.date | postDate }}</time>
        <span class="read-time" aria-label="{% if lang == 'tr' %}Tahmini okuma süresi: {% else %}Estimated reading time: {% endif %}{{ content | readingTime: lang }}">{{ content | readingTime: lang }}</span>
      </div>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <p class="post-back"><a href="/blog/" class="post-back-link" aria-label="Back to all posts"><span class="back-arrow" aria-hidden="true">←</span> Back to all posts</a></p>
  </article>
  <script>
    (function() {
      const codeBlocks = document.querySelectorAll('.post-content pre');
      codeBlocks.forEach(function(pre, index) {
        pre.setAttribute('aria-label', 'Code snippet ' + (index + 1));
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-copy-btn';
        btn.setAttribute('aria-label', 'Copy code snippet to clipboard');

        const statusId = 'code-copy-status-' + index;
        btn.setAttribute('aria-describedby', statusId);
        btn.innerHTML =
          '<svg class="copy-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25v-7.5Z"/><path fill="currentColor" d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25v-7.5Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25h-7.5Z"/></svg>' +
          '<svg class="check-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>' +
          '<span class="code-copy-label">Copy</span>' +
          '<span class="code-copy-tooltip" id="tooltip-' + index + '">Copy snippet</span>' +
          '<span class="sr-only" aria-live="polite" id="' + statusId + '"></span>';

        wrapper.appendChild(btn);

        let timeout;
        btn.addEventListener('click', function() {
          const codeText = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
          const statusEl = document.getElementById(statusId);
          const tooltip = document.getElementById('tooltip-' + index);

          function setCopied(success) {
            const label = btn.querySelector('.code-copy-label');
            if (success) {
              btn.classList.add('copied');
              if (label) label.textContent = 'Copied!';
              if (tooltip) tooltip.textContent = 'Copied!';
              btn.setAttribute('aria-label', 'Code snippet copied to clipboard');
              if (statusEl) statusEl.textContent = 'Code snippet copied to clipboard';
            } else {
              btn.classList.add('copied');
              if (label) label.textContent = 'Failed';
              if (tooltip) tooltip.textContent = 'Failed to copy';
              btn.setAttribute('aria-label', 'Failed to copy code snippet');
              if (statusEl) statusEl.textContent = 'Failed to copy code snippet';
            }

            clearTimeout(timeout);
            timeout = setTimeout(function() {
              escapeTimeouts.delete(btn);
              resetCopyButton(btn);
              if (statusEl) statusEl.textContent = '';
            }, 2000);
            escapeTimeouts.set(btn, timeout);
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(codeText).then(function() {
              setCopied(true);
            }).catch(function() {
              fallbackCopy(codeText, setCopied);
            });
          } else {
            fallbackCopy(codeText, setCopied);
          }
        });

      });

      function resetCopyButton(btn) {
        btn.classList.remove('copied');
        const label = btn.querySelector('.code-copy-label');
        if (label) label.textContent = 'Copy';
        const wrapper = btn.closest('.code-block-wrapper');
        if (wrapper) {
          const tooltip = wrapper.querySelector('.code-copy-tooltip');
          if (tooltip) tooltip.textContent = 'Copy snippet';
        }
        btn.setAttribute('aria-label', 'Copy code snippet to clipboard');
        const srStatus = btn.querySelector('[aria-live="polite"]');
        if (srStatus) srStatus.textContent = '';
      }

      const escapeTimeouts = new WeakMap();

      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.preventDefault();

        const copiedBtns = document.querySelectorAll('.code-copy-btn.copied');
        if (copiedBtns.length === 0) return;

        copiedBtns.forEach(function(btn) {
          const timeout = escapeTimeouts.get(btn);
          if (timeout) clearTimeout(timeout);
          escapeTimeouts.delete(btn);
          resetCopyButton(btn);
        });
      });

      function fallbackCopy(text, callback) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textarea);
          callback(successful);
        } catch (err) {
          callback(false);
        }
      }
    })();
  </script>
